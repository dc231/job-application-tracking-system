spring.application.name=job-application-tracking-system

spring.datasource.url=jdbc:postgresql://localhost:5432/job_application_db
spring.datasource.username=job_user
spring.datasource.password=job_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true